[workspace]
resolver = "2"
members = ["crates/yq-core", "crates/yq-wasm", "crates/yq-cli", "crates/yq-node"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT AND Apache-2.0"
repository = "https://github.com/taras/yq.rs"

# Keep native and wasm builds small.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
