name: Verify and release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: echo "matrix=$(python3 .github/release/native.py matrix)" >> "$GITHUB_OUTPUT"

  build-native:
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: metadata
        shell: bash
        run: python3 .github/release/verify.py metadata
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.metadata.outputs.node }}
          package-manager-cache: false
      - name: Build native package
        shell: bash
        run: |
          rustup target add '${{ matrix.target }}'
          if [[ '${{ matrix.os }}' == linux ]]; then
            python3 -m venv target/cross-tools
            source target/cross-tools/bin/activate
            pip install 'cargo-zigbuild==${{ steps.metadata.outputs.cargo_zigbuild }}' 'ziglang==${{ steps.metadata.outputs.ziglang }}'
          fi
          python3 .github/release/build_native.py '${{ matrix.id }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.id }}
          path: target/native-artifacts/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build-native
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      node: ${{ steps.metadata.outputs.node }}
      npm: ${{ steps.metadata.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: metadata
        name: Check versions and tag
        run: python3 .github/release/verify.py metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.metadata.outputs.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.metadata.outputs.bun }}
      - name: Install pinned toolchains
        run: |
          rustup show active-toolchain
          npm install --global npm@${{ steps.metadata.outputs.npm }} --ignore-scripts
          python3 .github/release/install_binaryen.py >> "$GITHUB_PATH"
      - name: Check Rust and conformance
        run: |
          cargo fmt --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          RUSTDOCFLAGS='-D warnings' cargo doc --locked -p yq-core --no-deps
      - name: Check minimum supported Rust
        run: |
          rustup toolchain install '${{ steps.metadata.outputs.msrv }}' --profile minimal
          cargo +${{ steps.metadata.outputs.msrv }} test --locked -p yq-core
      - name: Build and optimize wasm
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p yq-wasm
          wasm-opt --version
          wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int target/wasm32-unknown-unknown/release/yq_wasm.wasm -o js/yq.wasm
          python3 .github/release/verify.py size
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: target/native-artifacts/
      - name: Build and test installed npm package on Node and Bun
        run: |
          npm ci --omit=optional
          cargo build --locked --release -p yq-cli
          node js/platform-test.mjs
          npm run typecheck
          npm run build
          YQ_TEST_NATIVE_PACKAGE="$PWD/target/native-artifacts/yq.rs-linux-x64-gnu-${{ steps.metadata.outputs.version }}.tgz" YQ_TEST_NATIVE_ADDON_PACKAGE="$PWD/target/native-artifacts/yq.rs-linux-x64-gnu-napi-${{ steps.metadata.outputs.version }}.tgz" npm test
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.0"
          cache: false
      - name: Check out pinned Go oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikefarah/yq
          ref: a814ff5166040ec745a96bddd79ee31c3a548e83
          path: ref/yq
          persist-credentials: false
      - name: Compare installed CLI with Go yq on Node and Bun
        run: |
          (cd ref/yq && go build -o ../yq-ref .)
          npm run test:cli
        env:
          GOTOOLCHAIN: local
      - name: Verify published Rust package and tests
        run: |
          cargo publish --locked --dry-run -p yq-core
          # The publish dry run does not retain an archive on a clean runner.
          cargo package --locked -p yq-core
          version='${{ steps.metadata.outputs.version }}'
          package_dir=$(mktemp -d)
          tar -xzf "target/package/yq-core-$version.crate" -C "$package_dir"
          cargo test --locked --manifest-path "$package_dir/yq-core-$version/Cargo.toml"
      - name: Assemble verified release artifacts
        run: python3 .github/release/verify.py bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs-${{ github.sha }}
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 7

  smoke-native:
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ github.sha }}
          path: target/release-artifacts/
      - name: Check installed packages on Node 22
        if: matrix.id != 'linux-x64-musl'
        shell: bash
        run: |
          cp target/release-artifacts/yq.wasm js/yq.wasm
          npm ci --omit=optional --ignore-scripts
          npm run build
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          export YQ_TEST_NATIVE_PACKAGE="$PWD/target/release-artifacts/yq.rs-${{ matrix.id }}-$version.tgz"
          export YQ_TEST_NATIVE_ADDON_PACKAGE="$PWD/target/release-artifacts/yq.rs-${{ matrix.id }}-napi-$version.tgz"
          node js/package-test.mjs node
      - name: Check installed packages on Alpine
        if: matrix.id == 'linux-x64-musl'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work node:22.23.3-alpine sh .github/release/smoke_alpine.sh

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, smoke-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_TOKEN_AVAILABLE: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.verify.outputs.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned toolchains
        run: |
          rustup show active-toolchain
          npm install --global npm@${{ needs.verify.outputs.npm }} --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ github.sha }}
          path: target/release-artifacts/
      - id: registry
        name: Verify artifacts and check existing publications
        run: python3 .github/release/verify.py registries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Attest verified release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release-artifacts/*
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: cargo-auth
        if: steps.registry.outputs.cargo_exists != 'true' && env.CARGO_TOKEN_AVAILABLE != 'true'
      - name: Publish yq-core
        if: steps.registry.outputs.cargo_exists != 'true'
        run: |
          cargo package --locked -p yq-core
          cmp "target/package/yq-core-${{ needs.verify.outputs.version }}.crate" "target/release-artifacts/yq-core-${{ needs.verify.outputs.version }}.crate"
          cargo publish --locked -p yq-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.cargo-auth.outputs.token }}
      - name: Publish native packages before the meta package
        run: python3 .github/release/verify.py publish-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish npm with provenance
        if: steps.registry.outputs.npm_exists != 'true'
        run: npm publish "target/release-artifacts/${{ steps.registry.outputs.npm_file }}" --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Wait for the meta package to become installable
        run: python3 .github/release/verify.py wait-npm
      - name: Create GitHub release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file target/release-artifacts/release-notes.md
            gh release upload "$RELEASE_TAG" target/release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" target/release-artifacts/* --verify-tag --title "$RELEASE_TAG" --notes-file target/release-artifacts/release-notes.md
          fi
