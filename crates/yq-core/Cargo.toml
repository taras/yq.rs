[package]
name = "yq-core"
description = "Rust implementation of the yq (mikefarah/yq) expression language over YAML and JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["yaml", "json", "yq", "query", "wasm"]
categories = ["parser-implementations", "text-processing", "wasm"]
documentation = "https://docs.rs/yq-core"
rust-version = "1.87"
include = ["/src/**", "/tests/**", "/licenses/**", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/Cargo.toml"]

[dependencies]
regex-lite = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
